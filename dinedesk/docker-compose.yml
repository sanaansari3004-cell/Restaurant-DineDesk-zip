services:
  db:
    image: postgres:16-alpine
    container_name: dinedesk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dinedesk
      POSTGRES_PASSWORD: dinedesk
      POSTGRES_DB: dinedesk
    ports:
      - "5433:5432" # host 5433 to avoid clashing with a local postgres on 5432
    volumes:
      - dinedesk-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dinedesk -d dinedesk"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  dinedesk-pgdata:
